<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firmware Tracker</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="masthead" aria-label="Tracker overview">
      <h1>Firmware Tracker</h1>
      <a id="manage-devices" class="ghost" hidden>Manage devices on GitHub <span aria-hidden="true">↗</span></a>
    </header>

    <section class="firmware-status" id="firmware-status" aria-label="Unseen release status">
      <div>
        <span class="section-label">Your firmware watchlist</span>
        <strong id="firmware-status-title" role="status">No unseen releases</strong>
        <p id="firmware-status-detail">Compared with what you’ve seen in this browser. Installed versions aren’t tracked.</p>
        <span class="firmware-status-meta" id="firmware-status-meta">Sources checked: unknown</span>
      </div>
      <div class="updates-actions" id="firmware-status-actions" hidden>
        <button class="primary" id="mark-updates-seen">Mark all as seen</button>
      </div>
    </section>

    <section class="tracker-surface" aria-label="Devices">
      <div class="source-banner" id="source-banner">
        <div id="source-banner-text"></div>
        <button class="ghost" id="hide-source-banner">Hide</button>
      </div>
      <div class="toolbar" role="search" aria-label="Find devices">
        <label class="search-field">Search devices
          <input type="search" id="device-search" placeholder="Search by name or category" autocomplete="off" />
        </label>
        <div class="control"><label for="category-filter">Category</label>
          <select id="category-filter"><option value="">All categories</option></select>
        </div>
        <label class="check-filter"><input type="checkbox" id="unseen-filter" /> Unseen releases only</label>
        <div class="control"><label for="sort-order">Sort by</label>
          <select id="sort-order">
            <option value="category:asc">Category · A–Z</option>
            <option value="category:desc">Category · Z–A</option>
            <option value="name:asc">Device · A–Z</option>
            <option value="name:desc">Device · Z–A</option>
            <option value="version:desc">Version · highest first</option>
            <option value="version:asc">Version · lowest first</option>
            <option value="date:desc">Release · newest first</option>
            <option value="date:asc">Release · oldest first</option>
            <option value="age:asc">Age · youngest first</option>
            <option value="age:desc">Age · oldest first</option>
          </select>
        </div>
      </div>
      <div class="results-summary">
        <span id="result-count" role="status" aria-atomic="true"></span>
        <button class="text-button" id="clear-filters" hidden>Clear filters</button>
      </div>
      <div class="table-wrap" id="table-container"></div>
      <div id="empty-results" class="empty-results" hidden>
        <h2>No matching devices</h2>
        <p>Try another search or clear the filters.</p>
      </div>
    </section>
    <noscript><p>Enable JavaScript to browse this tracker, or read the <a href="FIRMWARE_SUMMARY.md">firmware summary</a>.</p></noscript>
  </main>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <div class="modal-header">
      <div><span class="section-label">Release history</span><h2 id="modal-title">Device</h2></div>
      <button class="ghost" id="close-modal" autofocus>Close</button>
    </div>
    <div class="modal-content" id="modal-content"></div>
  </dialog>

  <script src="devices/categories.js"></script>
  <script src="devices/index.js"></script>
  <script src="devices/config.js"></script>
  <script src="app.js"></script>
</body>
</html>
