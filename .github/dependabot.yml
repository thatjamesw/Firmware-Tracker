version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Helsinki"
    groups:
      python-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Helsinki"
    groups:
      github-actions-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
    open-pull-requests-limit: 2

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Helsinki"
    groups:
      npm-patches:
        patterns:
          - "*"
        update-types:
          - "patch"
    open-pull-requests-limit: 2
