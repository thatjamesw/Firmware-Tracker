name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # Generated updates already pass PR checks before merging.
    paths-ignore:
      - data/devices.json
      - docs/devices/categories.js
      - docs/devices/index.js
      - docs/devices/config.js
      - docs/FIRMWARE_SUMMARY.md

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner=off

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate build script output generation
        run: python scripts/generate_index.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Frontend behavior tests
        run: node --test tests/frontend.test.js

      - name: Frontend smoke test
        run: python scripts/smoke_test_frontend.py

      - name: Install browser test dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile browser tests
        run: npm run test:browser
