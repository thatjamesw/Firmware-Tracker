name: Update and Deploy Firmware Tracker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "data/**", "scripts/**", "requirements.txt", ".github/workflows/update-and-deploy.yml"]
  schedule:
    # Try several early slots so the generated site is usually ready before
    # the workday in Europe/Helsinki. Avoid :00 because GitHub scheduled
    # workflows are more likely to be delayed or dropped then.
    - cron: '7 5 * * *'
      timezone: Europe/Helsinki
    - cron: '17 6 * * *'
      timezone: Europe/Helsinki
    - cron: '27 7 * * *'
      timezone: Europe/Helsinki

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_now: ${{ steps.gate.outputs.run_now }}
    steps:
      - name: Decide whether to run today
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: update-and-deploy.yml
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run_now=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch. Proceeding."
            exit 0
          fi

          read -r start_utc end_utc < <(python3 - <<'PYTHON'
          from datetime import datetime, time, timedelta, timezone
          from zoneinfo import ZoneInfo
          finland = ZoneInfo("Europe/Helsinki")
          start = datetime.combine(datetime.now(finland).date(), time.min, finland)
          print(*(d.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ") for d in (start, start + timedelta(days=1))))
          PYTHON
          )

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          last_scan_utc="$(gh api "repos/${GITHUB_REPOSITORY}/contents/data/devices.json?ref=${main_sha}" \
            --jq '.content' | base64 --decode | jq -r '.sources.sync_status.last_run_utc // ""')"
          published_runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs?branch=main&event=push&status=success&per_page=50")"

          published_today="$(jq \
            --arg last_scan_utc "$last_scan_utc" \
            --arg main_sha "$main_sha" \
            --arg start_utc "$start_utc" \
            --arg end_utc "$end_utc" \
            '$last_scan_utc >= $start_utc and $last_scan_utc < $end_utc
              and any(.workflow_runs[]; .head_sha == $main_sha and .created_at >= $last_scan_utc and .conclusion == "success")' \
            <<< "$published_runs")"

          if [[ "$published_today" == "true" ]]; then
            echo "run_now=false" >> "$GITHUB_OUTPUT"
            echo "Today's scan is merged and published. Skipping."
          else
            echo "run_now=true" >> "$GITHUB_OUTPUT"
            echo "Today's scan has not been merged and published. Proceeding."
          fi

  build:
    if: needs.schedule-gate.outputs.run_now == 'true'
    needs: schedule-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install sync dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run parser and schema tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Fetch tracked firmware details from official sources
        if: github.event_name != 'push'
        run: python scripts/fetch_firmware_details.py --fail-on-regression --metrics-file scan-metrics.json

      - name: Report incomplete scan
        if: always() && github.event_name != 'push'
        run: |
          if [[ ! -f scan-metrics.json ]]; then
            printf '## Firmware scan\n\nThe scan did not complete. See the failed step above for details.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scan metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scan-metrics
          path: scan-metrics.json
          if-no-files-found: ignore

      - name: Generate browser assets
        run: python scripts/generate_index.py

      - name: Frontend behavior tests
        run: node --test tests/frontend.test.js

      - name: Frontend smoke test
        run: python scripts/smoke_test_frontend.py

      - name: Show generated changes
        run: |
          if [[ -n "$(git status --porcelain data/devices.json docs/devices docs/FIRMWARE_SUMMARY.md)" ]]; then
            echo "Generated content changed; scans propose a PR and main pushes deploy."
            git status --porcelain data/devices.json docs/devices docs/FIRMWARE_SUMMARY.md
          else
            echo "No generated changes detected."
          fi

      - name: Create or Update Sync PR
        if: github.event_name != 'push'
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.FW_BOT_TOKEN || github.token }}
          commit-message: "chore: sync firmware data from official sources and regenerate assets"
          branch: "automation/daily-firmware-sync"
          delete-branch: false
          title: "chore: daily firmware sync"
          body: |
            Automated daily firmware sync update.

            This PR contains generated updates from official sources:
            - `data/devices.json`
            - `docs/devices/*`
            - `docs/FIRMWARE_SUMMARY.md`
          labels: |
            automation
            firmware-sync
          add-paths: |
            data/devices.json
            docs/devices/categories.js
            docs/devices/index.js
            docs/devices/config.js
            docs/FIRMWARE_SUMMARY.md

      - name: Enable Auto-merge for Sync PR
        if: steps.cpr.outputs.pull-request-number
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.FW_BOT_TOKEN || github.token }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
